[package]
name = "blabber-llm"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "An open GTK4 LLM chat GUI for GNOME following Adwaita design"
license = "GPL-3.0-only"
repository = "https://github.com/jankammerath/BlabberLLM"

[dependencies]
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_16"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
